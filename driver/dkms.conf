# DKMS rebuilds this driver automatically for every new kernel
# (same mechanism the NVIDIA driver uses), so kernel updates no longer
# leave the laptop without it.
PACKAGE_NAME="linuwu-sense"
PACKAGE_VERSION="25.701-nitro1"
BUILT_MODULE_NAME[0]="linuwu_sense"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
CLEAN="make KVER=${kernelver} KDIR=${kernel_source_dir} clean"
AUTOINSTALL="yes"
